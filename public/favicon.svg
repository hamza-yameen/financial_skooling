<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="fsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B1E" />
      <stop offset="45%" stop-color="#5C6E42" />
      <stop offset="100%" stop-color="#8B9B6D" />
    </linearGradient>
    <linearGradient id="fsBars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#fsGrad)" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" stroke="#BAC8A1" stroke-opacity="0.35" stroke-width="1.5" />

  <!-- Ascending Wealth / Foundation Columns -->
  <rect x="6" y="19" width="3.2" height="6" rx="1" fill="url(#fsBars)" fill-opacity="0.55" />
  <rect x="11.2" y="14.5" width="3.2" height="10.5" rx="1" fill="url(#fsBars)" fill-opacity="0.75" />
  <rect x="16.4" y="10" width="3.2" height="15" rx="1" fill="url(#fsBars)" fill-opacity="0.95" />

  <!-- Dynamic Trendline Vector -->
  <path d="M6.5 17.5 L12 13 L17.5 9.5 L24 5.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Apex Arrowhead -->
  <path d="M19.5 5.5 L24 5.5 L24 10" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pinnacle Star / Prosperity Dot -->
  <circle cx="24" cy="5.5" r="1.5" fill="#EBE2D6" />
</svg>

